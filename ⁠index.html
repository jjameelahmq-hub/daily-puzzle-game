<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لغز اليوم المتجدد 🧩</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121213;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background-color: #1a1a1b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { margin-bottom: 5px; font-size: 24px; color: #4caf50; }
        .subtitle { font-size: 14px; color: #818384; margin-bottom: 20px; }
        .puzzle-box {
            background-color: #272729;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            border: 2px solid #3a3a3c;
            border-radius: 6px;
            background-color: #121213;
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            background-color: #538d4e;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 85%;
        }
        button:hover { background-color: #457a41; }
        .result { margin-top: 20px; font-weight: bold; font-size: 18px; }
        .ad-space {
            margin-top: 25px;
            padding: 15px;
            border: 1px dashed #3a3a3c;
            color: #565758;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>لغز اليوم 🧩</h1>
    <div class="subtitle">يتجدد اللغز تلقائياً كل 24 ساعة</div>

    <div class="puzzle-box" id="puzzleText">جاري تحميل لغز اليوم...</div>

    <input type="text" id="userInput" placeholder="اكتب إجابتك هنا...">
    <br>
    <button onclick="checkAnswer()">تأكيد الإجابة</button>

    <div class="result" id="resultText"></div>

    <!-- المساحة المخصصة للإعلانات مستقبلاً -->
    <div class="ad-space">مساحة إعلانية</div>
</div>

<script>
    // قائمة الألغاز اليومية
    const puzzles = [
        { q: "ما هو الشيء الذي كلما أخذت منه كبر؟", a: "الحفرة" },
        { q: "ما هو الشيء الذي يمشي بلا أرجل ويدخل الأذنين فقط؟", a: "الصوت" },
        { q: "شيء يملك أسناناً ولا يعض، فما هو؟", a: "المشط" },
        { q: "ما هو البيت الذي ليس فيه أبواب ولا نوافذ؟", a: "بيت الشعر" },
        { q: "شيء كلما زاد نقص، فما هو؟", a: "العمر" }
    ];

    // تحديد لغز اليوم بناءً على التاريخ اليومي
    const today = new Date();
    const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
    const currentPuzzle = puzzles[dayOfYear % puzzles.length];

    document.getElementById('puzzleText').innerText = currentPuzzle.q;

    function checkAnswer() {
        const userAns = document.getElementById('userInput').value.trim();
        const resultDiv = document.getElementById('resultText');

        if (userAns === currentPuzzle.a) {
            resultDiv.style.color = "#4caf50";
            resultDiv.innerText = "🎉 إجابة صحيحة! أحسنت، عد غداً للغز جديد.";
        } else {
            resultDiv.style.color = "#f44336";
            resultDiv.innerText = "❌ إجابة خاطئة، حاول مرة أخرى!"; 
        }
    }
</script>

</body>
</html>
